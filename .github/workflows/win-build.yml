name: Windows Build

# Builds, packages and uploads one or more Windows variants; pushes, pull
# requests and tags build all of them. The artifact names are what
# model-sweep.yml, asr-test.yml and resolve_build.sh look up, so they are fixed
# per variant:
#
#   XRT     fastflowlm-windows-<sha>                 (+ fastflowlm-windows-msi-<sha>)
#   HRX     HRX-fastflowlm-windows-<sha>
#   Source  models-from-source-fastflowlm-windows-<sha>
#
# A tag also publishes the XRT zip and MSI, and the HRX zip, to its release.
on:
  push:
    branches:
      - main
      - windows_zip_workflow
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      variants:
        description: XRT, HRX, Source, a comma-separated list of them, or "all".
        type: string
        default: all
      msi:
        description: Also build the MSI installer when the XRT variant is built.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      variants:
        description: Variant to build
        type: choice
        options: [all, XRT, HRX, Source]
        default: all
      msi:
        description: Also build the MSI installer when the XRT variant is built
        type: boolean
        default: true

# A build for a commit that has since been superseded on the same PR only
# delays that PR's model sweep, which waits for this whole run. Only
# pull_request runs share a group; every other run gets its own, so branch and
# tag builds are never cancelled.
concurrency:
  group: win-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
      msi: ${{ steps.plan.outputs.msi }}
    steps:
      # Push, pull_request and tag runs have no inputs: they build everything,
      # MSI included.
      - name: Expand variants
        id: plan
        env:
          VARIANTS: ${{ inputs.variants || 'all' }}
          MSI: ${{ inputs.msi }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          variants="${VARIANTS//,/ }"
          if [ "$(echo ${variants})" = "all" ]; then
            variants="XRT HRX Source"
          fi

          include='[]'
          has_xrt=false
          for variant in ${variants}; do
            case "${variant}" in
              XRT)    artifact="fastflowlm-windows-${SHA}"; has_xrt=true ;;
              HRX)    artifact="HRX-fastflowlm-windows-${SHA}" ;;
              Source) artifact="models-from-source-fastflowlm-windows-${SHA}" ;;
              *)
                echo "::error::Unknown Windows build variant '${variant}'."
                exit 1
                ;;
            esac
            include=$(jq -c --arg v "${variant}" --arg a "${artifact}" \
              '. + [{variant: $v, artifact: $a}]' <<< "${include}")
          done
          if [ "${include}" = '[]' ]; then
            echo "::error::No Windows build variant given."
            exit 1
          fi

          msi=false
          if [ "${has_xrt}" = "true" ] && [ "${MSI}" != "false" ]; then
            msi=true
          fi

          echo "include=${include}" >> "$GITHUB_OUTPUT"
          echo "msi=${msi}" >> "$GITHUB_OUTPUT"

  # The builds run on GitHub-hosted runners, outside the corporate proxy that
  # intermittently blocks third-party downloads on the self-hosted ones.
  # windows-2025-vs2026 carries Visual Studio 2026 for the windows-vs18 preset.
  build:
    name: build (${{ matrix.variant }})
    needs: plan
    runs-on: windows-2025-vs2026
    strategy:
      # Each variant ships on its own; one failing must not cancel the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build
        id: build
        uses: ./.github/actions/win-build
        with:
          variant: ${{ matrix.variant }}

      - name: Prepare package files
        shell: powershell
        working-directory: src
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_DIR: ${{ steps.build.outputs.build-dir }}
          HRX_RUNTIME: ${{ steps.build.outputs.hrx-runtime }}
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE $env:BUILD_DIR
          $dist = "dist"

          if (Test-Path $dist) {
            Remove-Item $dist -Recurse -Force
          }

          New-Item -ItemType Directory -Force $dist | Out-Null

          # Main executable
          Copy-Item -Path $build\flm.exe -Destination $dist\ -Force

          # Required data assets
          Copy-Item -Path .\xclbins -Destination $dist\ -Recurse -Force
          Copy-Item -Path .\model_list.json -Destination $dist\ -Force
          Copy-Item -Path .\model_info.json -Destination $dist\ -Force
          Copy-Item -Path ..\LICENSE_RUNTIME.txt -Destination $dist\ -Force
          Copy-Item -Path ..\LICENSE_BINARY.txt -Destination $dist\ -Force
          Copy-Item -Path ..\THIRD_PARTY_NOTICES.txt -Destination $dist\ -Force

          if ($env:VARIANT -eq 'HRX') {
            Copy-Item -Path .\lib\*.dll -Destination $dist\ -Force
            # HRX-variant op libraries override the default ones
            Copy-Item -Path .\lib\hrx\*.dll -Destination $dist\ -Force
            Copy-Item -Path $env:HRX_RUNTIME -Destination $dist\ -Force
          } else {
            Copy-Item -Path .\lib\xrt\*.dll -Destination $dist\ -Force
            Copy-Item -Path .\lib\*.dll -Destination $dist\ -Force
          }

          if ($env:VARIANT -eq 'Source') {
            # Source-built engines override the prebuilt ones from lib\xrt.
            Copy-Item -Path $build\engines\*.dll -Destination $dist\ -Force

            $sourceEngine = Get-FileHash $build\engines\gemma4e_npu.dll -Algorithm SHA256
            $prebuiltEngine = Get-FileHash .\lib\xrt\gemma4e_npu.dll -Algorithm SHA256
            $stagedEngine = Get-FileHash $dist\gemma4e_npu.dll -Algorithm SHA256
            if ($sourceEngine.Hash -eq $prebuiltEngine.Hash) {
              throw "The source-built Gemma 4 DLL matches the prebuilt DLL."
            }
            if ($sourceEngine.Hash -ne $stagedEngine.Hash) {
              throw "The staged Gemma 4 DLL does not match the source-built DLL."
            }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src/dist/
          if-no-files-found: error

  # Packages the flm.exe from the XRT build instead of building it again, so
  # the MSI and the portable zip ship the same binary. Runs after a failed
  # sibling variant too; it only needs the XRT artifact, and fails without it.
  msi:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.msi == 'true' }}
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download portable build artifact
        uses: actions/download-artifact@v4
        with:
          name: fastflowlm-windows-${{ github.sha }}
          path: portable-dist

      - name: Build MSI installer
        id: msi
        uses: ./.github/actions/win-msi
        with:
          flm-exe: portable-dist/flm.exe

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastflowlm-windows-msi-${{ github.sha }}
          path: ${{ steps.msi.outputs.msi }}
          if-no-files-found: error

  # The release jobs wait on the whole build matrix, and run even when part of
  # it failed: each downloads only the artifacts it ships, by name, and fails
  # if one of those is missing. A failed HRX or models-from-source build so
  # leaves the release without that asset instead of holding back the others.
  release:
    runs-on: ubuntu-latest
    needs: [build, msi]
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    permissions:
      contents: write

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: fastflowlm-windows-${{ github.sha }}
          path: portable-dist

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: fastflowlm-windows-msi-${{ github.sha }}
          path: msi-dist

      - name: Create release zip
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          zip_name="fastflowlm_${version}_windows_amd64.zip"

          # Zip the portable dist payload once for the GitHub Release asset.
          cd portable-dist
          zip -r "../${zip_name}" .

      - name: Stage MSI installer
        run: cp msi-dist/flm-setup.msi ./flm-setup.msi

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            fastflowlm_*.zip
            flm-setup.msi
          overwrite_files: true
          fail_on_unmatched_files: true

  # The HRX build ships as a preview, so it gets its own release job: a failed
  # HRX build leaves the release without the HRX asset instead of holding back
  # the default ones.
  release-hrx:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    permissions:
      contents: write

    steps:
      - name: Download HRX portable artifact
        uses: actions/download-artifact@v4
        with:
          name: HRX-fastflowlm-windows-${{ github.sha }}
          path: hrx-dist

      - name: Create HRX release zip
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          zip_name="HRX_fastflowlm_${version}_windows_amd64.zip"

          # Same layout as the default zip: flm.exe and its DLLs at the top level.
          cd hrx-dist
          zip -r "../${zip_name}" .

      - name: Upload HRX assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            HRX_fastflowlm_*.zip
          overwrite_files: true
          fail_on_unmatched_files: true
